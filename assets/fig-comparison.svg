    <rect x="560" y="312" width="90" height="56" rx="6" fill="#f7f9fb"/>
    <text x="570" y="345">高</text>
    <rect x="658" y="312" width="74" height="56" rx="6" fill="#e8f5ef"/>
    <text x="666" y="345" fill="#1c7a52" font-weight="700">最高</text>
  </g>
  <text x="28" y="396" fill="#6b7684" font-size="13.5">自考含金量在成人学历里最高、难度也最高；是否值得，看你的用途认不认自考。</text>
  <text x="28" y="424" fill="#9aa6b4" font-size="12">自考本科指南 · 横向对照仅供决策参考，具体以官方政策为准</text>
</svg>
