    <rect x="324" y="312" width="110" height="56" rx="6" fill="#fdf0e8"/>
    <text x="334" y="345" fill="#c8551a" font-weight="700">高</text>
    <rect x="442" y="312" width="110" height="56" rx="6" fill="#f7f9fb"/>
