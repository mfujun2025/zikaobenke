    <rect x="186" y="184" width="130" height="56" rx="6" fill="#f7f9fb"/>
    <text x="196" y="217">需参加统考</text>
    <rect x="324" y="184" width="110" height="56" rx="6" fill="#fff7e8"/>
    <text x="334" y="217" font-weight="700">中</text>
    <rect x="442" y="184" width="110" height="56" rx="6" fill="#f7f9fb"/>
    <text x="452" y="217">2.5–3 年</text>
    <rect x="560" y="184" width="90" height="56" rx="6" fill="#f7f9fb"/>
    <text x="570" y="217">中</text>
    <rect x="658" y="184" width="74" height="56" rx="6" fill="#eef1f5"/>
    <text x="666" y="217">中</text>

    <rect x="28" y="248" width="150" height="56" rx="6" fill="#e8f0fa"/>
    <text x="40" y="281" font-weight="700">开放大学</text>
    <rect x="186" y="248" width="130" height="56" rx="6" fill="#f7f9fb"/>
    <text x="196" y="281">注册入学</text>
    <rect x="324" y="248" width="110" height="56" rx="6" fill="#e8f5ef"/>
    <text x="334" y="281" fill="#1c7a52" font-weight="700">较低</text>
    <rect x="442" y="248" width="110" height="56" rx="6" fill="#f7f9fb"/>
    <text x="452" y="281">2.5–3 年</text>
    <rect x="560" y="248" width="90" height="56" rx="6" fill="#f7f9fb"/>
    <text x="570" y="281">中</text>
    <rect x="658" y="248" width="74" height="56" rx="6" fill="#eef1f5"/>
    <text x="666" y="281">中</text>

    <rect x="28" y="312" width="150" height="56" rx="6" fill="#e8f0fa"/>
    <text x="40" y="345" font-weight="700">普通统招</text>
    <rect x="186" y="312" width="130" height="56" rx="6" fill="#f7f9fb"/>
